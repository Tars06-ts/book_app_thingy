<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c060"/>
      <stop offset="50%" stop-color="#c8922a"/>
      <stop offset="100%" stop-color="#8a6018"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8a868" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- chain -->
  <path d="M50 0 L50 8 M50 12 L50 18 M50 22 L50 28" stroke="#6e5847" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="10" r="2" fill="none" stroke="#6e5847" stroke-width="1.5"/>
  <circle cx="50" cy="20" r="2" fill="none" stroke="#6e5847" stroke-width="1.5"/>
  <circle cx="50" cy="30" r="2.5" fill="#6e5847"/>

  <!-- top finial -->
  <path d="M50 32 Q44 36 42 42 Q46 40 50 41 Q54 40 58 42 Q56 36 50 32 Z" fill="url(#gold)"/>
  <circle cx="50" cy="33" r="2" fill="#f0c060"/>

  <!-- crown / cap with scrollwork -->
  <path d="M30 50 Q35 42 50 40 Q65 42 70 50 L66 54 Q58 47 50 47 Q42 47 34 54 Z" fill="url(#gold)"/>
  <!-- scroll details on crown -->
  <path d="M32 51 Q28 48 26 52 Q29 53 32 51" fill="none" stroke="#c8922a" stroke-width="1.5"/>
  <path d="M68 51 Q72 48 74 52 Q71 53 68 51" fill="none" stroke="#c8922a" stroke-width="1.5"/>

  <!-- top rim band -->
  <path d="M28 54 L72 54 L68 60 L32 60 Z" fill="url(#gold)"/>
  <line x1="32" y1="57" x2="68" y2="57" stroke="#8a6018" stroke-width="0.8" opacity="0.6"/>

  <!-- decorative rosette center top -->
  <circle cx="50" cy="57" r="4" fill="#f0c060"/>
  <circle cx="50" cy="57" r="2" fill="#c8922a"/>

  <!-- lantern body frame - hexagonal -->
  <!-- left panel -->
  <path d="M32 60 L24 100 L32 130 L40 130 L36 95 L38 62 Z" fill="url(#gold)" opacity="0.95"/>
  <!-- right panel -->
  <path d="M68 60 L76 100 L68 130 L60 130 L64 95 L62 62 Z" fill="url(#gold)" opacity="0.95"/>

  <!-- glass panels -->
  <path d="M38 62 L36 95 L40 130 L46 130 L44 95 L43 62 Z" fill="url(#glassGrad)"/>
  <path d="M62 62 L64 95 L60 130 L54 130 L56 95 L57 62 Z" fill="url(#glassGrad)"/>
  <rect x="44" y="62" width="12" height="68" fill="url(#glassGrad)"/>

  <!-- vertical gold frame lines -->
  <line x1="38" y1="62" x2="36" y2="95" stroke="#7c6233" stroke-width="1.5"/>
  <line x1="36" y1="95" x2="40" y2="130" stroke="#9c752b" stroke-width="1.5"/>
  <line x1="44" y1="62" x2="44" y2="130" stroke="#89682a" stroke-width="1.2"/>
  <line x1="56" y1="62" x2="56" y2="130" stroke="#a97b24" stroke-width="1.2"/>
  <line x1="62" y1="62" x2="64" y2="95" stroke="#775b27" stroke-width="1.5"/>
  <line x1="64" y1="95" x2="60" y2="130" stroke="#7d602b" stroke-width="1.5"/>

  <!-- horizontal crossbar mid -->
  <line x1="36" y1="95" x2="64" y2="95" stroke="#906a25" stroke-width="1" opacity="0.6"/>

  <!-- candle/light glow inside -->
  <ellipse cx="50" cy="90" rx="4" ry="20" fill="#eac760" opacity="0.4"/>
  <rect x="48" y="100" width="4" height="22" rx="2" fill="#f0dca0" opacity="0.7"/>

  <!-- bottom rim band -->
  <path d="M24 100 L18 102 L20 108 L80 108 L82 102 L76 100 Z" fill="url(#gold)" opacity="0" />
  <path d="M22 130 L78 130 L74 136 L26 136 Z" fill="url(#gold)"/>
  <line x1="26" y1="133" x2="74" y2="133" stroke="#8a6018" stroke-width="0.8" opacity="0.6"/>

  <!-- decorative side scrolls mid-body -->
  <path d="M24 100 Q18 98 16 102 Q19 105 24 102" fill="none" stroke="#c8922a" stroke-width="1.3"/>
  <path d="M76 100 Q82 98 84 102 Q81 105 76 102" fill="none" stroke="#c8922a" stroke-width="1.3"/>

  <!-- pointed bottom finial -->
  <path d="M40 136 L60 136 L54 148 L50 156 L46 148 Z" fill="url(#gold)"/>
  <circle cx="50" cy="153" r="2" fill="#957b46"/>

  <!-- small bottom scrolls -->
  <path d="M42 138 Q38 142 40 146 Q43 144 43 140" fill="none" stroke="#8a6018" stroke-width="1"/>
  <path d="M58 138 Q62 142 60 146 Q57 144 57 140" fill="none" stroke="#8a6018" stroke-width="1"/>

</svg>