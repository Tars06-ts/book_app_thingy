<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 72" width="56" height="72">

  <!-- pot body -->
  <path d="M16 52 L14 68 Q28 72 42 68 L40 52 Z" fill="#8b4a20"/>
  <path d="M16 52 L14 68 Q28 72 42 68 L40 52 Z" fill="#6b3510" opacity="0.4"/>

  <!-- pot rim -->
  <rect x="13" y="48" width="30" height="6" rx="3" fill="#a05a28"/>
  <rect x="14" y="48" width="28" height="4" rx="2" fill="#c07038"/>

  <!-- pot pixel detail -->
  <line x1="18" y1="56" x2="18" y2="66" stroke="#6b3510" stroke-width="1" opacity="0.4"/>
  <line x1="28" y1="57" x2="28" y2="68" stroke="#6b3510" stroke-width="1" opacity="0.3"/>
  <line x1="38" y1="56" x2="38" y2="66" stroke="#6b3510" stroke-width="1" opacity="0.4"/>

  <!-- soil -->
  <ellipse cx="28" cy="50" rx="13" ry="3" fill="#3a2010"/>

  <!-- main stem -->
  <line x1="28" y1="50" x2="28" y2="20" stroke="#4a7a20" stroke-width="2.5" stroke-linecap="round"/>

  <!-- stem curve left -->
  <path d="M28 38 Q18 30 14 20" stroke="#4a7a20" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- stem curve right -->
  <path d="M28 30 Q38 22 42 12" stroke="#4a7a20" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- stem curve left 2 -->
  <path d="M28 24 Q20 18 16 10" stroke="#5a8a28" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- leaf 1 - left big -->
  <ellipse cx="14" cy="19" rx="9" ry="5" fill="#4a7a20" transform="rotate(-30 14 19)"/>
  <ellipse cx="14" cy="19" rx="7" ry="3.5" fill="#5a9228" transform="rotate(-30 14 19)" opacity="0.7"/>
  <line x1="14" y1="19" x2="8" y2="14" stroke="#3a6018" stroke-width="0.8" opacity="0.6"/>

  <!-- leaf 2 - right big -->
  <ellipse cx="42" cy="11" rx="9" ry="5" fill="#4a7a20" transform="rotate(20 42 11)"/>
  <ellipse cx="42" cy="11" rx="7" ry="3.5" fill="#5a9228" transform="rotate(20 42 11)" opacity="0.7"/>
  <line x1="42" y1="11" x2="48" y2="7" stroke="#3a6018" stroke-width="0.8" opacity="0.6"/>

  <!-- leaf 3 - top center -->
  <ellipse cx="28" cy="16" rx="8" ry="4.5" fill="#6aaa30" transform="rotate(-10 28 16)"/>
  <ellipse cx="28" cy="16" rx="6" ry="3" fill="#7aba40" transform="rotate(-10 28 16)" opacity="0.7"/>
  <line x1="28" y1="16" x2="25" y2="10" stroke="#3a6018" stroke-width="0.8" opacity="0.6"/>

  <!-- leaf 4 - left small -->
  <ellipse cx="16" cy="9" rx="6" ry="3.5" fill="#5a9228" transform="rotate(-40 16 9)"/>
  <line x1="16" y1="9" x2="12" y2="5" stroke="#3a6018" stroke-width="0.7" opacity="0.5"/>

  <!-- leaf 5 - right small -->
  <ellipse cx="36" cy="22" rx="6" ry="3" fill="#5a9228" transform="rotate(15 36 22)"/>
  <line x1="36" y1="22" x2="42" y2="19" stroke="#3a6018" stroke-width="0.7" opacity="0.5"/>

  <!-- tiny highlight dots -->
  <circle cx="26" cy="15" r="1.2" fill="#90d050" opacity="0.5"/>
  <circle cx="40" cy="10" r="1" fill="#90d050" opacity="0.4"/>
  <circle cx="13" cy="18" r="1" fill="#90d050" opacity="0.4"/>

</svg>